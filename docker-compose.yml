services:
  frontend:
    build: .
    container_name: booktrack-frontend
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - booktrack-network
    restart: unless-stopped

networks:
  booktrack-network:
    external: true
    name: booktrack-backend_default
