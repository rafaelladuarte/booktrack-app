name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install "django>=6.1,<7" httpx python-dotenv whitenoise gunicorn
      - name: Rodar testes
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "False"
        run: python manage.py test
