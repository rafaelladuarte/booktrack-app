<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookTrack{% endblock %}</title>
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/design-tokens.css' %}?v=1.3">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}?v=1.3">
    <link rel="stylesheet" href="{% static 'css/cards.css' %}?v=1.3">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="app-root">
        <!-- Sidebar -->
        <nav class="sidebar" id="app-sidebar">
            <div class="sidebar-logo">
                <a href="/" class="sidebar-logo-content" style="text-decoration: none; color: inherit;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span class="sidebar-logo-text">BookTrack</span>
                </a>
                <button class="sidebar-pin-btn" id="pin-sidebar-btn" title="Fixar Barra Lateral">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="17" x2="12" y2="22"></line>
                        <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.68V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3v4.68a2 2 0 0 1-1.11 1.87l-1.78.89A2 2 0 0 0 5 15.24Z"></path>
                    </svg>
                </button>
            </div>

            <span class="sidebar-section">Biblioteca</span>
            <div class="sidebar-nav">
                <a href="{% url 'library' %}" class="sidebar-item {% if request.resolver_match.url_name == 'library' %}active{% endif %}">
                    <div class="sidebar-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="9" y1="21" x2="9" y2="9"></line>
                        </svg>
                    </div>
                    <span class="sidebar-label">Coleção</span>
                </a>
                <a href="{% url 'categories' %}" class="sidebar-item {% if request.resolver_match.url_name == 'categories' %}active{% endif %}">
                    <div class="sidebar-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </div>
                    <span class="sidebar-label">Categorias</span>
                </a>
            </div>
            
            {% if request.session.access_token %}
            <div class="sidebar-nav" style="margin-top: auto;">
                <a href="{% url 'logout' %}" class="sidebar-item">
                    <div class="sidebar-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </div>
                    <span class="sidebar-label">Sair</span>
                </a>
            </div>
            {% endif %}
        </nav>

        <!-- Main Wrapper -->
        <main class="main-wrapper">
            <header class="app-header">
                <form method="get" action="{% url 'library' %}" class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" name="q" class="search-input" placeholder="Buscar livros, autores..." value="{{ request.GET.q|default_if_none:'' }}">
                </form>
                <div class="user-profile">
                    <!-- Placeholder para futuro usuário -->
                </div>
            </header>

            <!-- Main Content Area -->
            <div class="library-viewport">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- Generic Entity Creation Modal -->
    <div class="modal-overlay" id="modal-create-entity">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-create-entity')">✖</button>
            <h2 class="modal-title" id="create-entity-title">Novo Cadastro</h2>
            <form id="form-create-entity">
                <input type="hidden" id="entity_type" name="entity_type">
                <input type="hidden" id="target_select_id" name="target_select_id">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="entity_name" name="name" required>
                </div>
                <!-- Campos extras para autores -->
                <div id="author_extra_fields" style="display: none;">
                    <div class="form-group">
                        <label>Gênero</label>
                        <select id="entity_gender" name="gender">
                            <option value="">Selecione...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                            <option value="O">Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>País de Origem</label>
                        <input type="text" id="entity_country" name="country_of_origin">
                    </div>
                </div>
                <button type="submit" class="btn-save">Salvar</button>
            </form>
        </div>
    </div>

    <script>
    function openEntityModal(type, title, targetSelectId) {
        document.getElementById('entity_type').value = type;
        document.getElementById('target_select_id').value = targetSelectId;
        document.getElementById('create-entity-title').innerText = title;
        document.getElementById('entity_name').value = '';
        
        if (type === 'authors') {
            document.getElementById('author_extra_fields').style.display = 'block';
            document.getElementById('entity_gender').value = '';
            document.getElementById('entity_country').value = '';
        } else {
            document.getElementById('author_extra_fields').style.display = 'none';
        }
        
        document.getElementById('modal-create-entity').style.display = 'flex';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const sidebar = document.getElementById('app-sidebar');
        const pinBtn = document.getElementById('pin-sidebar-btn');
        if (sidebar && pinBtn) {
            if (localStorage.getItem('sidebarPinned') === 'true') {
                sidebar.classList.add('pinned');
            }
            pinBtn.addEventListener('click', () => {
                sidebar.classList.toggle('pinned');
                localStorage.setItem('sidebarPinned', sidebar.classList.contains('pinned'));
            });
        }
    });

    if (typeof window.closeModal !== 'function') {
        window.closeModal = function(id) {
            document.getElementById(id).style.display = 'none';
        };
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.getElementById('form-create-entity').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const type = document.getElementById('entity_type').value;
        const targetSelectId = document.getElementById('target_select_id').value;
        const name = document.getElementById('entity_name').value;
        const btn = this.querySelector('button[type="submit"]');
        
        const payload = { name: name };
        if (type === 'authors') {
            const gender = document.getElementById('entity_gender').value;
            const country = document.getElementById('entity_country').value;
            if (gender) payload.gender = gender;
            if (country) payload.country_of_origin = country;
        }

        btn.disabled = true;
        btn.innerText = 'Salvando...';

        fetch(`/api/create-entity/${type}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json().then(data => ({ status: response.status, body: data })))
        .then(res => {
            btn.disabled = false;
            btn.innerText = 'Salvar';
            
            if (res.status >= 200 && res.status < 300) {
                const entity = res.body; 
                if (entity && entity.id && entity.name) {
                    const selects = document.querySelectorAll(`select[name="${targetSelectId}"]`);
                    selects.forEach(selectEl => {
                        const option = document.createElement('option');
                        option.value = entity.id;
                        option.textContent = entity.name;
                        selectEl.appendChild(option);
                        selectEl.value = entity.id;
                    });
                }
                closeModal('modal-create-entity');
            } else {
                alert('Erro ao criar: ' + (res.body.error || 'Erro desconhecido'));
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerText = 'Salvar';
            alert('Erro de conexão');
            console.error(err);
        });
    });
    </script>
</body>
</html>
