<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookTrack{% endblock %}</title>
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/design-tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'css/cards.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="app-root">
        <!-- Sidebar -->
        <nav class="sidebar">
            <a href="/" class="sidebar-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <span>BookTrack</span>
            </a>

            <span class="sidebar-section">Biblioteca</span>
            <div class="sidebar-nav">
                <a href="/" class="sidebar-item active">
                    <div class="sidebar-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="9" y1="21" x2="9" y2="9"></line>
                        </svg>
                    </div>
                    <span class="sidebar-label">Coleção</span>
                </a>
            </div>
            
            <div style="flex-grow: 1;"></div>
            
            {% if request.session.access_token %}
            <div class="sidebar-nav">
                <a href="{% url 'logout' %}" class="sidebar-item">
                    <div class="sidebar-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </div>
                    <span class="sidebar-label">Sair</span>
                </a>
            </div>
            {% endif %}
        </nav>

        <!-- Main Wrapper -->
        <main class="main-wrapper">
            <header class="app-header">
                <form method="get" action="{% url 'library' %}" class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" name="q" class="search-input" placeholder="Buscar livros, autores..." value="{{ request.GET.q|default_if_none:'' }}">
                </form>
                <div class="user-profile">
                    <!-- Placeholder para futuro usuário -->
                </div>
            </header>

            <!-- Main Content Area -->
            <div class="library-viewport">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
