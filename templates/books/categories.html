{% extends 'base.html' %}

{% block title %}Gerenciar Categorias - BookTrack{% endblock %}

{% block content %}
<div class="header">
    <div class="header-left">
        <h1 class="page-title">Gerenciar Categorias</h1>
        <p style="color: var(--text-secondary); margin-top: 5px;">Crie, edite ou exclua categorias da sua biblioteca.<br><br></p>
    </div>
    <div class="header-actions">
        <button class="btn-primary" onclick="openCategoryModal()">+ Nova Categoria Raiz</button>
        <br><br>
    </div>
</div>

<div class="filters-panel" style="margin-bottom: 20px;">
    <div id="tree-container" style="background: var(--background-light); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border);">
        <!-- Tree will be injected here via JS -->
    </div>
</div>

<!-- Modal Category Form -->
<div class="modal-overlay" id="modal-category">
    <div class="modal-content" style="max-width: 400px;">
        <button class="modal-close" onclick="closeCategoryModal()">✖</button>
        <h2 class="modal-title" id="modal-category-title">Nova Categoria</h2>
        
        <form id="category-form" onsubmit="submitCategoryForm(event)">
            <input type="hidden" id="cat-id" name="id">
            
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="cat-name" name="name" required minlength="2">
            </div>
            
            <div class="form-group">
                <label>Categoria Pai</label>
                <select id="cat-parent" name="parent_id">
                    <option value="">Nenhuma (Raiz)</option>
                    {% for c in categories_flat %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
                <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 5px;">Selecione uma categoria pai para criar uma subcategoria.</small>
            </div>
            
            <button type="submit" class="btn-save">Salvar</button>
        </form>
    </div>
</div>

<style>
    .tree-actions {
        display: flex;
        gap: 8px;
    }
    .tree-actions button {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        transition: background 0.2s ease;
    }
    .btn-edit { color: var(--accent); }
    .btn-edit:hover { background: rgba(56, 189, 248, 0.1); }
    
    .btn-delete { color: var(--danger-color, #ff4d4d); }
    .btn-delete:hover { background: rgba(255, 77, 77, 0.1); }
    
    .btn-add-sub { color: var(--success-color, #4ade80); }
    .btn-add-sub:hover { background: rgba(74, 222, 128, 0.1); }
    
    details > summary::-webkit-details-marker {
        display: none;
    }
    details[open] > summary > .tree-arrow {
        transform: rotate(90deg);
    }
    details > summary > .tree-arrow {
        transition: transform 0.2s;
    }
    details[open] > summary .tree-actions {
        display: none;
    }
</style>

<script>
    const categoriesData = {{ categories_json|safe|default:"[]" }};
    
    function buildTree(data) {
        let tree = [];
        let lookup = {};
        
        data.forEach(c => {
            lookup[c.id] = { ...c, children: [] };
        });
        
        data.forEach(c => {
            if (c.parent_id && lookup[c.parent_id]) {
                lookup[c.parent_id].children.push(lookup[c.id]);
            } else {
                tree.push(lookup[c.id]);
            }
        });
        return tree;
    }
    
    function renderTreeHTML(nodes, isRoot = false) {
        if (!nodes || nodes.length === 0) return '';
        
        let html = `<div class="tree-list ${isRoot ? 'root' : ''}" style="${!isRoot ? 'margin-left: 20px;' : ''}">`;
        nodes.forEach(node => {
            const hasChildren = node.children && node.children.length > 0;
            const contentDiv = `
                <div class="tree-content" style="display: flex; flex: 1; align-items: center; justify-content: space-between;">
                    <span style="font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
                        ${hasChildren ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>'} ${node.name}
                    </span>
                    <div class="tree-actions">
                        <button class="btn-add-sub" onclick="event.preventDefault(); event.stopPropagation(); openCategoryModal(null, ${node.id})" title="Adicionar Subcategoria">+ Sub</button>
                        <button class="btn-edit" style="display: inline-flex; align-items: center; gap: 4px;" onclick="event.preventDefault(); event.stopPropagation(); openCategoryModal(${node.id})" title="Editar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> Editar</button>
                        <button class="btn-delete" style="display: inline-flex; align-items: center; gap: 4px;" onclick="event.preventDefault(); event.stopPropagation(); deleteCategory(${node.id})" title="Excluir"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg> Excluir</button>
                    </div>
                </div>
            `;
            
            if (hasChildren) {
                html += `
                <details class="tree-item" style="margin: 8px 0;">
                    <summary style="cursor: pointer; display: flex; align-items: center; list-style: none; padding: 8px 12px; background: var(--background-dark); border: 1px solid var(--border); border-radius: var(--radius-sm); transition: border-color 0.2s ease;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
                        <div class="tree-arrow" style="margin-right: 8px; color: var(--text-muted); font-size: 0.8rem;">▶</div>
                        ${contentDiv}
                    </summary>
                    <div class="tree-children" style="margin-top: 8px; padding-left: 10px; border-left: 1px dashed var(--border-light);">
                        ${renderTreeHTML(node.children)}
                    </div>
                </details>`;
            } else {
                html += `
                <div class="tree-item" style="margin: 8px 0; padding: 8px 12px; background: var(--background-dark); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; margin-left: 20px;">
                    ${contentDiv}
                </div>`;
            }
        });
        html += `</div>`;
        return html;
    }
    
    function initTree() {
        const tree = buildTree(categoriesData);
        const container = document.getElementById('tree-container');
        if (tree.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Nenhuma categoria encontrada.</p>';
        } else {
            container.innerHTML = renderTreeHTML(tree, true);
        }
    }
    
    function openCategoryModal(categoryId = null, parentId = null) {
        const modal = document.getElementById('modal-category');
        const form = document.getElementById('category-form');
        const title = document.getElementById('modal-category-title');
        
        form.reset();
        document.getElementById('cat-id').value = '';
        
        if (categoryId) {
            // Edit mode
            title.textContent = 'Editar Categoria';
            const cat = categoriesData.find(c => c.id === categoryId);
            if (cat) {
                document.getElementById('cat-id').value = cat.id;
                document.getElementById('cat-name').value = cat.name;
                document.getElementById('cat-parent').value = cat.parent_id || '';
            }
        } else {
            // Create mode
            title.textContent = 'Nova Categoria';
            if (parentId) {
                document.getElementById('cat-parent').value = parentId;
            }
        }
        
        modal.style.display = 'flex';
    }
    
    function closeCategoryModal() {
        document.getElementById('modal-category').style.display = 'none';
    }
    
    async function submitCategoryForm(e) {
        e.preventDefault();
        
        const id = document.getElementById('cat-id').value;
        const name = document.getElementById('cat-name').value;
        let parent_id = document.getElementById('cat-parent').value;
        parent_id = parent_id ? parseInt(parent_id) : null;
        
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/manage-category/${id}/` : `/api/manage-category/`;
        
        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ name, parent_id })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                window.location.reload(); // simple reload to see changes
            } else if (response.status === 401) {
                window.location.href = '/login/';
            } else {
                alert(`Erro: ${data.error || 'Falha ao salvar'}`);
            }
        } catch (error) {
            alert('Erro de comunicação.');
        }
    }
    
    async function deleteCategory(id) {
        if (!confirm('Tem certeza que deseja excluir esta categoria?')) return;
        
        try {
            const response = await fetch(`/api/manage-category/${id}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            });
            
            if (response.ok) {
                window.location.reload();
            } else if (response.status === 401) {
                window.location.href = '/login/';
            } else {
                const data = await response.json();
                alert(`Erro: ${data.error || 'Falha ao excluir'}`);
            }
        } catch (error) {
            alert('Erro de comunicação.');
        }
    }
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', initTree);
</script>
{% endblock %}
